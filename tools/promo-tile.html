<!doctype html>
<!-- Chrome Web Store small promo tile (440x280). Rendered to store/promo-small-440x280.png by tools/store_assets.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 24px;
        box-sizing: border-box;
        background: radial-gradient(120% 140% at 0% 0%, #2a3550 0%, #161b27 55%, #10131b 100%);
        color: #eef1f6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      img {
        width: 124px;
        height: 124px;
        flex: none;
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.45));
      }
      h1 {
        margin: 0 0 6px;
        font-size: 36px;
        font-weight: 750;
        letter-spacing: -0.5px;
      }
      p {
        margin: 0 0 14px;
        font-size: 15px;
        line-height: 1.35;
        color: #b9c2d3;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chips span {
        padding: 2px 6px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #dfe5ef;
      }
    </style>
  </head>
  <body>
    <img src="../store/icon-512.png" alt="" />
    <div>
      <h1>Atom Viewer</h1>
      <p>Right-click a structure file,<br />see it in 3D.</p>
      <div class="chips"><span>.xyz</span><span>.extxyz</span><span>.cif</span><span>.pdb</span><span>POSCAR</span></div>
    </div>
  </body>
</html>
