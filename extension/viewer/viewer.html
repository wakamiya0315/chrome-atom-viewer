<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atom Viewer</title>
    <link rel="stylesheet" href="viewer.css" />
    <script type="module" src="viewer.js"></script>
  </head>
  <body class="dark">
    <header id="bar">
      <div id="title">
        <span id="name">Atom Viewer</span>
        <span id="meta"></span>
      </div>
      <div id="tools">
        <button id="btn-reset" title="Reset view (R)">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" /></svg>
        </button>
        <button class="txt" data-view="a" title="View along a (A)">a</button>
        <button class="txt" data-view="b" title="View along b (B)">b</button>
        <button class="txt" data-view="c" title="View along c (C)">c</button>
        <button class="txt" id="btn-ortho" title="Orthographic / perspective projection (O)">Ortho</button>
        <button id="btn-shot" title="Save as PNG">
          <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg>
        </button>
        <button id="btn-settings" title="Display settings">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg>
        </button>
        <span class="sep embedded-only"></span>
        <button id="btn-dock" class="embedded-only" title="Dock to bottom">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5" /><path id="dock-icon-line" d="M14 4v16" /></svg>
        </button>
        <button id="btn-full" class="embedded-only" title="Full screen / restore">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
        </button>
        <button id="btn-close" class="embedded-only" title="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
    </header>

    <main id="stage">
      <div id="legend"></div>
      <div id="hover" hidden></div>
      <div id="measure" hidden></div>
      <svg id="axes" viewBox="0 0 80 80"></svg>
      <div id="status"></div>

      <form id="settings" hidden>
        <label class="row"><span>Atom size <output data-for="atomScale"></output></span>
          <input type="range" name="atomScale" min="0.15" max="1.5" step="0.05" /></label>
        <label class="row check"><input type="checkbox" name="showBonds" /> Show bonds</label>
        <label class="row check"><input type="checkbox" name="metalBonds" /> Include metal–metal bonds</label>
        <label class="row"><span>Bond cutoff (× sum of covalent radii) <output data-for="bondTol"></output></span>
          <input type="range" name="bondTol" min="0.8" max="1.5" step="0.02" /></label>
        <label class="row"><span>Bond thickness <output data-for="bondRadius"></output></span>
          <input type="range" name="bondRadius" min="0.04" max="0.4" step="0.01" /></label>
        <label class="row check"><input type="checkbox" name="showCell" /> Show unit cell</label>
        <label class="row check"><input type="checkbox" name="wrap" /> Wrap atoms into the cell</label>
        <div class="row">
          Supercell
          <span class="super">
            <input type="number" name="na" min="1" max="10" />×<input type="number" name="nb" min="1" max="10" />×<input type="number" name="nc" min="1" max="10" />
          </span>
        </div>
        <label class="row check"><input type="checkbox" name="light" /> Light background</label>
        <div class="row actions">
          <button type="button" id="btn-reset-settings" title="Restore all display settings to their defaults">Reset settings</button>
        </div>
        <p class="hint">Click atoms to select them (2: distance, 3: angle, 4: dihedral). Click an element in the legend to show / hide it.</p>
      </form>
    </main>

    <footer id="frames" hidden>
      <button id="btn-play" title="Play / pause (Space)">
        <svg viewBox="0 0 24 24"><path id="play-icon" d="M8 5v14l11-7z" /></svg>
      </button>
      <input type="range" id="frame-slider" min="0" max="0" value="0" />
      <span id="frame-label"></span>
      <span id="frame-info"></span>
    </footer>
  </body>
</html>
